{% extends 'base.html' %}

{% block content %}
<div class="grid">
    <section class="card">
        <h2>Sign in</h2>
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="post" action="/login" class="stacked-form">
            <label>Who are you?
                <select name="user_id" required>
                    {% for user in users %}
                    <option value="{{ user.id }}" {% if user.id == selected_user_id %}selected{% endif %}>{{ user.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
            <button type="submit" style="margin-top:8px">Sign in</button>
        </form>
    </section>
</div>
{% endblock %}
