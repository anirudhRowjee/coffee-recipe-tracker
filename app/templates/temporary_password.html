{% extends 'base.html' %}

{% block content %}
<div class="grid">
    <section class="card">
        <h2>Temporary password for {{ name }}</h2>
        <pre class="recipe-text temporary-password">{{ password }}</pre>
        <p>Send this to {{ name }} privately. They'll choose their own password when they first sign in. It won't be shown again.</p>
        <p><a href="/manage">Back to Manage</a></p>
    </section>
</div>
{% endblock %}
