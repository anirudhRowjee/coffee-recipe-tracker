<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffee Recipe Tracker</title>
    <link rel="stylesheet" href="{{ static('styles.css') }}" />
    <script src="{{ static('htmx.min.js') }}"></script>
    <script src="{{ static('step_editor.js') }}"></script>
    <script>
        function toggleForm(formId) {
            const form = document.getElementById(formId);
            form.classList.toggle('hidden');
        }

        // iOS decimal keypads have no minus key; the ± button next to a
        // signed input flips its sign and returns focus to it.
        function flipSign(btn) {
            const input = btn.previousElementSibling;
            const v = input.value.trim();
            if (v.startsWith('-')) input.value = v.slice(1);
            else if (v.startsWith('+')) input.value = '-' + v.slice(1);
            else input.value = '-' + v;
            input.focus();
        }
    </script>
</head>

<body>
    <div class="app-shell">
        {% block site_header %}
        <header>
            <h1>Coffee Recipe Tracker</h1>
            <nav>
                <a href="/">Brew</a>
                <a href="/browse">Browse</a>
                <a href="/manage">Manage</a>
                {% if current_user %}
                <a href="/account" style="margin-left:auto;font-weight:600">{{ current_user.name }}</a>
                {% endif %}
            </nav>
        </header>
        {% endblock %}
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <small>Lightweight HTMX app · SQLite backend</small>
        </footer>
    </div>
</body>

</html>
