{# Bag size as taps: common sizes, or Other with a − / + stepper (10 g) you can also type into.
   Expects size_name (the form field). static/forms.js runs the buttons. #}
<div class="bag-size">
    <p class="eyebrow">Bag size</p>
    <div class="seg" role="radiogroup" aria-label="Bag size">
        {% for g in [200, 250, 500, 1000] %}
        <label><input type="radio" name="size_pick" value="{{ g }}" {% if g == 250 %}checked{% endif %} /><span>{{ '1 kg' if g == 1000 else g ~ ' g' }}</span></label>
        {% endfor %}
        <label><input type="radio" name="size_pick" value="other" /><span>Other</span></label>
    </div>
    <div class="stepper bag-size-other" hidden>
        <button type="button" class="stepper-btn" data-step="-10" aria-label="10 g less">−</button>
        <input name="{{ size_name }}" type="number" inputmode="decimal" step="any" min="1" max="10000" value="250" data-label="Bag size" data-unit=" g" required />
        <button type="button" class="stepper-btn" data-step="10" aria-label="10 g more">+</button>
    </div>
</div>
